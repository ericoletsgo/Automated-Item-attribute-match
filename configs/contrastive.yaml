model:
  backbone: google/siglip-base-patch16-224
  freeze_backbone: true
  projection_dims:
    - 768
    - 512
    - 256
  unfreeze_layers: 2

training:
  batch_size: 128
  learning_rate: 3.0e-4
  finetune_learning_rate: 1.0e-5
  temperature: 0.07
  epochs: 50
  warmup_epochs: 5
  stage1_epochs: 5
  optimizer: adamw
  weight_decay: 1.0e-4

data:
  image_size: 224
  num_workers: 4
